<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050814">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Firefly">
<link rel="manifest" href="manifest.json">
<title>Firefly — tap to fly</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap');

  :root {
    --night-deep: #050814;
    --night: #0a1128;
    --canopy: #0f2e28;
    --leaf: #06d6a0;
    --glow: #ffd166;
    --glow-soft: #ffe9a8;
    --danger: #ef476f;
    --mist: #7d9bb8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--night-deep);
    font-family: 'Baloo 2', system-ui, sans-serif;
    touch-action: manipulation;
    user-select: none;
  }

  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hud {
    position: absolute;
    top: env(safe-area-inset-top, 16px);
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    padding-top: 14px;
  }

  .score {
    color: var(--glow-soft);
    font-size: 42px;
    font-weight: 700;
    text-shadow: 0 0 18px rgba(255, 209, 102, 0.55);
    letter-spacing: 1px;
  }

  .best {
    position: absolute;
    top: calc(env(safe-area-inset-top, 16px) + 8px);
    right: 60px;
    color: var(--mist);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .muteBtn {
    position: absolute;
    top: env(safe-area-inset-top, 10px);
    right: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,209,102,0.3);
    color: var(--glow-soft);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: none;
    padding: 0;
    z-index: 5;
  }

  .muteBtn:active { transform: none; box-shadow: none; }

  .shieldBadge {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 16px) + 18px);
    left: 0;
    right: 0;
    text-align: center;
    color: #7cf5c4;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(124,245,196,0.7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  .shieldBadge.show { opacity: 1; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--glow-soft);
    background: radial-gradient(ellipse at 50% 40%, rgba(10,17,40,0.2), rgba(5,8,20,0.86));
    padding: 24px;
    transition: opacity 0.3s ease;
  }

  .overlay h1 {
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(255, 209, 102, 0.4);
  }

  .overlay p {
    color: var(--mist);
    font-size: 15px;
    max-width: 260px;
    line-height: 1.5;
    margin-bottom: 22px;
  }

  .overlay .result {
    font-size: 17px;
    color: var(--glow);
    margin-bottom: 4px;
  }

  .overlay .resultbest {
    font-size: 13px;
    color: var(--mist);
    margin-bottom: 22px;
  }

  button {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--night-deep);
    background: linear-gradient(180deg, var(--glow-soft), var(--glow));
    border: none;
    border-radius: 999px;
    padding: 14px 38px;
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.45), 0 6px 0 rgba(150, 110, 20, 0.4);
    cursor: pointer;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 0 24px rgba(255, 209, 102, 0.45), 0 3px 0 rgba(150, 110, 20, 0.4);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div class="hud"><div class="score" id="score">0</div></div>
  <div class="best" id="best">BEST 0</div>
  <button class="muteBtn" id="muteBtn" aria-label="Toggle sound">🔊</button>
  <div class="shieldBadge" id="shieldBadge">✦ SPARK SHIELD ✦</div>

  <div class="overlay" id="startOverlay">
    <h1>Firefly</h1>
    <p>Tap to flutter upward. Let go to drift down. Slip through the gaps in the branches — don't touch the dark. Catch a golden spark for a few seconds of shield.</p>
    <button id="startBtn">Tap to begin</button>
  </div>

  <div class="overlay hidden" id="endOverlay">
    <h1>Lights out</h1>
    <div class="result" id="resultScore">0 gaps cleared</div>
    <div class="resultbest" id="resultBest">Best: 0</div>
    <button id="retryBtn">Fly again</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const resultScore = document.getElementById('resultScore');
  const resultBest = document.getElementById('resultBest');
  const muteBtn = document.getElementById('muteBtn');
  const shieldBadge = document.getElementById('shieldBadge');

  // --- Sound engine (Web Audio, no external files) ---
  let muted = false;
  let actx = null;
  function ensureAudio(){
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, duration, type, gainVal, delay){
    if(muted || !actx) return;
    const t0 = actx.currentTime + (delay || 0);
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal || 0.15, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }
  function sndFlap(){ tone(520, 0.09, 'triangle', 0.12); }
  function sndScore(){ tone(880, 0.12, 'sine', 0.14); tone(1180, 0.14, 'sine', 0.10, 0.05); }
  function sndPowerup(){ tone(660, 0.1, 'square', 0.10); tone(990, 0.12, 'square', 0.10, 0.06); tone(1320, 0.16, 'square', 0.10, 0.12); }
  function sndDie(){ tone(220, 0.28, 'sawtooth', 0.16); tone(140, 0.34, 'sawtooth', 0.14, 0.08); }

  muteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let bestScore = 0;

  // Game state
  let state = 'ready'; // ready | playing | dead
  let firefly, branches, particles, sparks, score, gravity, flapPower, speed, spawnTimer, gapSize, frame, sparkTimer, shieldTime;

  function reset(){
    firefly = { x: W * 0.28, y: H * 0.45, vy: 0, r: 9, wing: 0 };
    branches = [];
    particles = [];
    sparks = [];
    score = 0;
    gravity = H * 0.0013;
    flapPower = -H * 0.011;
    speed = W * 0.0033;
    spawnTimer = 0;
    gapSize = Math.max(H * 0.30, 190);
    frame = 0;
    sparkTimer = 260;
    shieldTime = 0;
    scoreEl.textContent = '0';
    shieldBadge.classList.remove('show');
  }

  function spawnBranch(){
    const margin = H * 0.08;
    const gapY = margin + Math.random() * (H - margin*2 - gapSize) + gapSize/2;
    branches.push({ x: W + 40, gapY, passed: false, sway: Math.random()*Math.PI*2, thick: 26 + Math.random()*14 });
  }

  function spawnSpark(){
    const margin = H * 0.15;
    const y = margin + Math.random() * (H - margin*2);
    sparks.push({ x: W + 30, y, r: 8, collected: false, spin: 0 });
  }

  function addParticle(x,y){
    particles.push({ x, y, r: 2 + Math.random()*2.5, life: 1, vx: -speed*0.6 - Math.random()*0.4, vy: (Math.random()-0.5)*0.6 });
  }

  function flap(){
    ensureAudio();
    if(state === 'ready'){
      startGame();
      return;
    }
    if(state === 'dead') return;
    firefly.vy = flapPower;
    firefly.wing = 1;
    sndFlap();
  }

  function startGame(){
    reset();
    state = 'playing';
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
  }

  function endGame(){
    if(shieldTime > 0) return; // shielded — ignore
    state = 'dead';
    sndDie();
    if(navigator.vibrate) navigator.vibrate(80);
    if(score > bestScore){ bestScore = score; }
    resultScore.textContent = score + (score === 1 ? ' gap cleared' : ' gaps cleared');
    resultBest.textContent = 'Best: ' + bestScore;
    bestEl.textContent = 'BEST ' + bestScore;
    shieldBadge.classList.remove('show');
    setTimeout(()=> endOverlay.classList.remove('hidden'), 420);
  }

  function update(){
    frame++;
    if(state === 'playing'){
      firefly.vy += gravity;
      firefly.vy = Math.min(firefly.vy, H*0.018);
      firefly.y += firefly.vy;
      firefly.wing *= 0.9;

      if(frame % 3 === 0) addParticle(firefly.x - firefly.r, firefly.y);

      spawnTimer -= 1;
      if(spawnTimer <= 0){
        spawnBranch();
        spawnTimer = Math.max(70, 110 - score*1.5);
      }

      sparkTimer -= 1;
      if(sparkTimer <= 0){
        spawnSpark();
        sparkTimer = 380 + Math.random()*220;
      }

      if(shieldTime > 0){
        shieldTime--;
        if(shieldTime <= 0) shieldBadge.classList.remove('show');
      }

      for(const b of branches){
        b.x -= speed * (H/300);
        b.sway += 0.02;

        if(!b.passed && b.x + b.thick < firefly.x){
          b.passed = true;
          score++;
          scoreEl.textContent = score;
          sndScore();
          if(score % 5 === 0){
            gapSize = Math.max(H*0.20, gapSize - H*0.012);
          }
        }

        const dx = Math.abs(b.x - firefly.x);
        if(dx < b.thick/2 + firefly.r && shieldTime <= 0){
          const topEdge = b.gapY - gapSize/2;
          const botEdge = b.gapY + gapSize/2;
          if(firefly.y - firefly.r < topEdge || firefly.y + firefly.r > botEdge){
            endGame();
          }
        }
      }
      branches = branches.filter(b => b.x > -60);

      for(const s of sparks){
        s.x -= speed * (H/300);
        s.spin += 0.08;
        if(!s.collected){
          const dx = s.x - firefly.x, dy = s.y - firefly.y;
          if(Math.sqrt(dx*dx + dy*dy) < s.r + firefly.r + 6){
            s.collected = true;
            shieldTime = 240;
            shieldBadge.classList.add('show');
            sndPowerup();
            if(navigator.vibrate) navigator.vibrate(30);
          }
        }
      }
      sparks = sparks.filter(s => s.x > -40 && !s.collected);

      if(firefly.y - firefly.r < 0 || firefly.y + firefly.r > H){
        endGame();
      }
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; });
    particles = particles.filter(p => p.life > 0);
  }

  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#050814');
    g.addColorStop(0.55, '#0a1128');
    g.addColorStop(1, '#0f2e28');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // distant stars
    ctx.fillStyle = 'rgba(200,220,255,0.5)';
    for(let i=0;i<40;i++){
      const sx = (i*97 + frame*0.05) % W;
      const sy = (i*53) % (H*0.6);
      const tw = 0.4 + 0.6*Math.abs(Math.sin(frame*0.02 + i));
      ctx.globalAlpha = tw * 0.5;
      ctx.beginPath();
      ctx.arc(sx, sy, 1.2, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBranch(b){
    const topEdge = b.gapY - gapSize/2;
    const botEdge = b.gapY + gapSize/2;
    const swayX = Math.sin(b.sway) * 4;

    ctx.fillStyle = '#0d1b16';
    ctx.strokeStyle = 'rgba(6,214,160,0.25)';
    ctx.lineWidth = 2;

    // top branch
    ctx.beginPath();
    ctx.moveTo(b.x - b.thick/2 + swayX, 0);
    ctx.lineTo(b.x - b.thick/2, topEdge);
    ctx.lineTo(b.x + b.thick/2, topEdge);
    ctx.lineTo(b.x + b.thick/2 + swayX, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // bottom branch
    ctx.beginPath();
    ctx.moveTo(b.x - b.thick/2 + swayX, H);
    ctx.lineTo(b.x - b.thick/2, botEdge);
    ctx.lineTo(b.x + b.thick/2, botEdge);
    ctx.lineTo(b.x + b.thick/2 + swayX, H);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // little glowing leaf buds near the gap
    ctx.fillStyle = 'rgba(6,214,160,0.6)';
    ctx.beginPath();
    ctx.arc(b.x, topEdge + 6, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, botEdge - 6, 2.5, 0, Math.PI*2);
    ctx.fill();
  }

  function drawSpark(s){
    const pulse = 1 + Math.sin(frame*0.12) * 0.15;
    const grad = ctx.createRadialGradient(s.x, s.y, 1, s.x, s.y, s.r*2.2*pulse);
    grad.addColorStop(0, 'rgba(255,246,200,0.95)');
    grad.addColorStop(1, 'rgba(6,214,160,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r*2.2*pulse, 0, Math.PI*2);
    ctx.fill();

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.spin);
    ctx.fillStyle = '#fff6c8';
    for(let i=0;i<4;i++){
      ctx.rotate(Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(s.r*0.4, s.r*1.6);
      ctx.lineTo(-s.r*0.4, s.r*1.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFirefly(){
    // trail particles
    particles.forEach(p => {
      ctx.globalAlpha = p.life * 0.6;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // glow halo
    const glowR = 22 + firefly.wing*6;
    const grad = ctx.createRadialGradient(firefly.x, firefly.y, 2, firefly.x, firefly.y, glowR);
    grad.addColorStop(0, 'rgba(255,233,168,0.9)');
    grad.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(firefly.x, firefly.y, glowR, 0, Math.PI*2);
    ctx.fill();

    // wings
    const wingSpread = 6 + firefly.wing*8;
    ctx.fillStyle = 'rgba(230,240,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(firefly.x - 4, firefly.y - 4, wingSpread, 5, -0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(firefly.x + 4, firefly.y - 4, wingSpread, 5, 0.4, 0, Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle = '#2b2118';
    ctx.beginPath();
    ctx.ellipse(firefly.x, firefly.y, firefly.r*0.7, firefly.r, 0, 0, Math.PI*2);
    ctx.fill();

    // glowing tail
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(firefly.x, firefly.y + firefly.r*0.6, 4, 0, Math.PI*2);
    ctx.fill();

    // shield aura
    if(shieldTime > 0){
      const pulse = 1 + Math.sin(frame*0.25)*0.08;
      ctx.strokeStyle = 'rgba(124,245,196,' + (0.55 + 0.2*Math.sin(frame*0.3)) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(firefly.x, firefly.y, (firefly.r + 10) * pulse, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function draw(){
    drawBackground();
    branches.forEach(drawBranch);
    sparks.forEach(drawSpark);
    if(state !== 'ready') drawFirefly();
    else {
      // gentle idle bob for the firefly on the start screen
      firefly.y = H*0.45 + Math.sin(frame*0.05)*10;
      drawFirefly();
    }
  }

  function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  loop();

  window.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    flap();
  }, { passive:false });

  startBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
  retryBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

  window.addEventListener('keydown', (e) => {
    if(e.code === 'Space') { e.preventDefault(); flap(); }
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
